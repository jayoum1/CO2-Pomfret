name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static export
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Prepare GitHub Pages export
        run: |
          # https://jayoum1.github.io/CO2-Pomfret/ serves `index.html` at the artifact root.
          # Use the Next.js `/midterm` page as the site home (new midterm demo), not the dashboard `/`.
          cp out/midterm/index.html out/index.html
          # Prevent GitHub Pages / Jekyll from ignoring `_next/` and other assets
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path is relative to repository root (not `defaults.run.working-directory`)
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
