name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build midterm-only static export
        env:
          GITHUB_ACTIONS: 'true'
          MIDTERM_EXPORT_ONLY: 'true'
        run: bash scripts/build-midterm-github-pages.sh

      - name: Prepare GitHub Pages export
        run: |
          # Site root shows the midterm showcase (not the dashboard).
          cp out/midterm/index.html out/index.html
          touch out/.nojekyll
          # Trim unused static assets copied from public/ (midterm only needs midterm-data + tree-species)
          rm -rf out/Graphs out/disturbances out/figures 2>/dev/null || true

      - name: Verify midterm page copy in static export
        # Fails the deploy if the build is missing the current showcase (e.g. stale checkout or wrong source).
        # Default working-directory is `web`, so `out/` is the Next export.
        run: |
          set -euo pipefail
          if ! grep -rq "Finishing retouches" out/; then
            echo "::error::Export is missing the updated 'Coming next' line from web/src/app/midterm/page.tsx"
            exit 1
          fi
          if ! grep -rq "Google Apps Script" out/; then
            echo "::error::Export is missing the Google Sheets/Forms 'Coming next' item"
            exit 1
          fi
          if grep -rq "Screenshot coming soon" out/; then
            echo "::error::Old screenshot gallery is still in the export — remove it from web/src/app/midterm/page.tsx and rebuild"
            exit 1
          fi
          echo "Midterm static export copy checks passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path is relative to repository root (not `defaults.run.working-directory`)
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
